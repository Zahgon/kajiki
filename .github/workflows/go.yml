name: go

on:
  push:
    branches-ignore:
      - 'gh-pages'
  pull_request:

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
